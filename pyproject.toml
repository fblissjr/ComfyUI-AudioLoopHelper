[project]
name = "comfyui-audioloophelper"
version = "0.4.10"
description = "Audio-aware loop management nodes for full-length music video generation with LTX 2.3"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8.0", "torch>=2.0", "torchaudio>=2.0", "orjson>=3.9"]
analysis = [
    "librosa>=0.10",
    "pillow>=12.2.0",
]
experiments = [
    "duckdb>=1.0",
    "httpx>=0.27",
]
metrics = [
    "torchvision>=0.18",
    "transformers>=4.46",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "scipy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]
addopts = "--import-mode=importlib"
